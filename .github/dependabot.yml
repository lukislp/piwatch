# Weekly Dependabot updates: GitHub Actions, the frontend (dev deps grouped), backend + ml requirements and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      # react and react-dom (plus their @types) must move together - a solo major bump on
      # either one alone triggers an ERESOLVE peer-dependency conflict. Group them so
      # Dependabot always proposes them in one PR.
      react:
        patterns:
          - "react*"
          - "@types/react*"
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: pip
    directories:
      - /backend
      - /ml
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
