# Weekly Dependabot updates: GitHub Actions, the frontend (dev deps grouped), backend + ml requirements and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: pip
    directories:
      - /backend
      - /ml
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
