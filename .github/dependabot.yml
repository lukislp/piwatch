# Weekly Dependabot updates: GitHub Actions, the frontend (dev deps grouped), backend + ml requirements and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
      # react and react-dom (plus their @types) must move together - a solo major bump on
      # either one alone triggers an ERESOLVE peer-dependency conflict. Group them so
      # Dependabot always proposes them in one PR.
      react:
        patterns:
          - "react*"
          - "@types/react*"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directories:
      - /backend
      - /ml
    # ml/requirements.in names the PyTorch CPU index itself (--extra-index-url), so pip-compile
    # finds torch 2.x+cpu without a Dependabot registry. A configured registry would make
    # Dependabot deny external code execution and refuse to run pip-compile at all.
    # torch itself is ignored: pip-compile resolves the next 2.x+cpu correctly, but Dependabot then
    # fetches the hashes through PyPI's JSON API (hashin), where +cpu builds do not exist and which
    # the PyTorch index does not offer - every torch update failed and broke the whole pip run.
    # Update torch by hand with the uv command in the header of ml/requirements.txt.
    ignore:
      - dependency-name: "torch"
    schedule:
      interval: daily
    # The OpenTelemetry packages pin each other exactly (opentelemetry-sdk 1.x needs
    # opentelemetry-api == 1.x), so a lone bump of one cannot resolve. A security update of
    # opentelemetry-api alone failed silently for that reason and ml/ stayed vulnerable.
    # Group them so version and security updates move all of them in one pull request.
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "opentelemetry-*"
      opentelemetry-security:
        applies-to: security-updates
        patterns:
          - "opentelemetry-*"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    # Base image majors (python 3.12->3.14, node 20->26) are handled deliberately on our own
    # schedule, not via Dependabot. 3.12->3.14 is a semver-minor bump per Dependabot's
    # versioning (python's scheme has no major segment change here), so both minor and major
    # are ignored for python; node's majors are ignored the normal way. Patch updates for both
    # keep flowing.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
