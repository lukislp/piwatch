# Policy of lktec-bot for this repository (https://github.com/lukislp/lktec-bot,
# docs/modules/automerge.md). Read from the default branch only, never from a pull request.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; a major is left to a person.
    majors: manual
    workflow-files: auto
    method: squash
    # Merge a pull request GitHub refuses to arm because it is already mergeable (merge verb,
    # lktec-bot v0.9.0): only that case, bound to the approved head, never an admin merge.
    merge-ready: true
    exclude: []
  # Tags and publishes a release from the Conventional Commits on the default branch (see
  # docs/modules/release.md in lukislp/lktec-bot).
  release:
    enabled: true
    mode: tag
    tag-format: "v{version}"
    branch: master
    first-version: "1.0.0"  # only used while no tag matches tag-format
    rules: []               # the former semantic-release setup had no custom rules

  # Commits the image tag bump of the deploy manifests onto the default branch after a release (see
  # docs/modules/sync.md in lukislp/lktec-bot). The App is a bypass actor of the branch ruleset for it.
  sync:
    enabled: true
    paths: [deploy, .github/badges]
    branch: master
    commit-message: "chore(deploy): image {version} [skip ci]"
    # Reports the bump as a check run "lktec-bot / deploy bump" on the release commit (lktec-bot v0.7.0+).
    check: true
    # Reports the bump as a check run "lktec-bot / deploy bump" on the release commit (needs v0.7.0+).
    check: true
