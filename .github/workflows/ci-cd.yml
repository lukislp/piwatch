name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  IMAGE: ghcr.io/lukislp/piwatch

permissions:
  actions: read
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage â€” runs on every push to master AND every pull request
  # ---------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest tests/ --cov=app --cov-report=json:coverage.json
        working-directory: backend
      # backend/pyproject.toml exists and is picked up automatically (working-directory:
      # backend, below). Its [tool.ruff.lint] ignores BLE001 (no blind `except Exception`) and
      # S110 (no bare try/except/pass), for the collectors/pollers' intentional broad-catch
      # resilience pattern - so the lint gate is narrower than plain ruff defaults.
      - run: ruff check .
      # Self-hosted coverage badge (no external service), same pattern as the other repos:
      # uploaded as a build artifact.
      - run: python3 ../scripts/generate_coverage_badge.py coverage.json coverage-badge.json
        working-directory: backend
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp backend/coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage.json"
          printf '%s\n' .github/badges/coverage.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # tsc -b type-checks as part of the build - no separate typecheck step needed.
      - run: npm run build
        working-directory: frontend
      # --omit=dev: the remaining findings (vite/esbuild) are dev-server-only advisories in
      # devDependencies never shipped in the built dist/ - only gate on what's actually shipped.
      - run: npm audit --omit=dev
        working-directory: frontend

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt

  # ml/ is a separate, standalone Python project (its own requirements.txt, no shared
  # dependency with backend/) - not wired into docker-build-push (no image ships it), which is
  # why it previously had no CI coverage at all: a green Dependabot PR against
  # ml/requirements.txt was proving nothing (2026-09-05).
  test-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install --require-hashes -r ml/requirements.txt -r ml/requirements-dev.txt
      - run: python -m pytest ml/tests/

  # Coverage-guided fuzzing of the pure parsers (backend/fuzz/): a short fixed budget per run,
  # enough to catch a crash on the next code change, cheap enough to run on every push.
  fuzz-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r backend/requirements.txt -r backend/requirements-fuzz.txt
      - run: python fuzz/fuzz_quantities.py -max_total_time=30 -rss_limit_mb=1024
        working-directory: backend
      - run: python fuzz/fuzz_flux_timestamps.py -max_total_time=30 -rss_limit_mb=1024
        working-directory: backend

  test-k8s-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/yannh/kubeconform:latest-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The binary sits at /kubeconform in the image, not on PATH. Custom CRDs
      # (Gateway API HTTPRoute, RateLimitPolicy, SealedSecret) may have no published
      # schema - ignore-missing-schemas treats that as skipped, not a hard failure.
      - run: /kubeconform -summary -ignore-missing-schemas deploy/

  build:
    # No implicit stage-sequencing under GitHub's DAG model (unlike GitLab) - wait for
    # every test job explicitly.
    needs: [test-backend, test-frontend, test-security, test-k8s-manifests, test-ml]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t piwatch:build-check .

  # ---------------------------------------------------------------------
  # Version / docker / release â€” push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    # Dry run: works out the next version from the Conventional Commits (rules in
    # .github/lktec-bot.yml) and creates nothing. `release` below cuts the tag.
    concurrency:
      group: piwatch-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@6663c22576563ed88d4f8492dd2e97aea1dc2eaf # v0.4.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). Each
    # leg pushes by digest only; docker-manifest-merge below writes the actual
    # :latest/:$NEXT_VERSION tags. Runs after the release job (not before, see that job) -
    # a build/push failure here never leaves an orphaned, un-tagged GHCR image blocking
    # every future release via the duplicate-tag guard below.
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      # Build once for THIS leg's native arch, load it locally and smoke-check it
      # before pushing anything - now covering BOTH architectures natively (the
      # QEMU-era job could only ever smoke-check amd64).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: piwatch:smoke-check
          cache-from: type=gha,scope=app-${{ matrix.arch }}
      - name: Smoke-check the built image
        run: |
          docker run -d --name piwatch-smoke -p 8000:8000 piwatch:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "container is healthy"
              docker rm -f piwatch-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs piwatch-smoke
          docker rm -f piwatch-smoke
          exit 1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, release, docker-build-push]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/piwatch/\.github/workflows/ci-cd\.yml@refs/heads/master$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, trivy-scan, test-backend]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    concurrency:
      group: piwatch-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@6663c22576563ed88d4f8492dd2e97aea1dc2eaf # v0.4.0
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/(piwatch)'
      paths: deploy
      branch: master
      handover-artifact: coverage-badge-handover
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  trivy-scan:
    needs: [get-version, release, docker-manifest-merge]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: piwatch-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    # Runs before docker-build-push now (see that job's comment) - the real tag/release must
    # exist before anything is published under that version.
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: piwatch-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@6663c22576563ed88d4f8492dd2e97aea1dc2eaf # v0.4.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
