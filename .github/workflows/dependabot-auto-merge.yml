name: Dependabot auto-merge

# Thin caller of the automerge workflow of lukislp/lktec-bot: the App approves routine
# Dependabot updates and enables auto-merge, GitHub merges once the checks are green. The
# triggers stay here because a reusable workflow cannot declare them for the caller. The
# policy is .github/lktec-bot.yml on the default branch (docs/modules/automerge.md of lktec-bot).
#
# Needs the repository secrets LKTEC_BOT_APP_ID and LKTEC_BOT_PRIVATE_KEY (the App's id and
# private key); the App must be installed on this repository.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  automerge:
    uses: lukislp/lktec-bot/.github/workflows/automerge.yml@feeee04720178085ec24ffdf8083fc30aea2bedf # v0.9.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}