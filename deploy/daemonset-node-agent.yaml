apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: piwatch-node-agent
  namespace: monitoring
  labels: {app: piwatch-node-agent}
spec:
  selector:
    matchLabels: {app: piwatch-node-agent}
  template:
    metadata:
      labels: {app: piwatch-node-agent}
    spec:
      # The node-agent makes no Kubernetes API calls (it only reads hostPath sysfs/procfs),
      # unlike the piwatch Deployment itself (ClusterRole for the watch API, see rbac.yaml).
      automountServiceAccountToken: false
      tolerations:
        # also run on the control-plane Pi
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
      containers:
        - name: agent
          image: ghcr.io/lukislp/piwatch:1.37.1 # {"$imagepolicy": "flux-system:piwatch"}
          command: ["uvicorn", "app.node_agent:app", "--host", "0.0.0.0", "--port", "9101"]
          # privileged: true is required ONLY for the NVMe SMART reader (node_agent.py's
          # read_nvme_smart(), via nvme-cli): the NVMe admin passthrough ioctl it issues is
          # gated by CAP_SYS_ADMIN/the device cgroup regardless of file permissions on
          # /dev/nvme0 - confirmed live (EPERM as root, non-privileged) before adding this.
          # This is a materially bigger privilege footprint than the rest of the agent
          # (everything else here is unprivileged, read-only sysfs/procfs access) - if you'd
          # rather not grant it, drop `privileged: true` and the `dev` volume/mount below;
          # temperature, model, capacity and the under-voltage flag all keep working from
          # plain sysfs, only the SMART fields (wear %, power-on hours, ...) go missing.
          securityContext:
            privileged: true
            # Explicit, not just implied by privileged:true: the previously-live manifest had
            # allowPrivilegeEscalation:false set, and since apply only adds/changes fields it
            # mentions, that stale false would otherwise survive the merge - combined with
            # privileged:true, the API server rejects that as invalid (confirmed live).
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 9101
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: PIWATCH_SYS, value: /host/sys}
            - {name: PIWATCH_PROC, value: /host/proc}
            - {name: PIWATCH_DISK_PATH, value: /host/root}
            - {name: PIWATCH_NVME_DEVICE, value: /host/dev/nvme0}
          volumeMounts:
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true}
            - {name: dev, mountPath: /host/dev}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 9101}
            periodSeconds: 30
      volumes:
        - {name: sys, hostPath: {path: /sys}}
        - {name: proc, hostPath: {path: /proc}}
        - {name: root, hostPath: {path: /}}
        - {name: dev, hostPath: {path: /dev}}
