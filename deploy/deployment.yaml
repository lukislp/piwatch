apiVersion: apps/v1
kind: Deployment
metadata:
  name: piwatch
  namespace: monitoring
  labels: {app: piwatch}
spec:
  # HA/failover: 2 replicas on different nodes. If one node goes down,
  # the second replica keeps serving; clients reconnect automatically.
  replicas: 2
  selector:
    matchLabels: {app: piwatch}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: piwatch}
    spec:
      serviceAccountName: piwatch
      affinity:
        podAntiAffinity:
          # preferred instead of required: if only 1 node remains, both
          # replicas are allowed to run there if needed.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: piwatch}
      initContainers:
        # The history hostPath is created (and was previously written) by
        # root; chown on every start - idempotent, one small sqlite db - so
        # the non-root backend below can keep writing it. The only root in
        # this pod.
        - name: fix-history-ownership
          image: busybox:1.36.1
          command: ["chown", "-R", "10001:10001", "/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: history, mountPath: /data}
      containers:
        - name: piwatch
          image: ghcr.io/lukislp/piwatch:1.39.2 # {"$imagepolicy": "flux-system:piwatch"}
          # The image runs as a dedicated UID-10001 user since the same-named
          # Dockerfile change; declared here so the posture is enforced, not
          # incidental.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            - containerPort: 8000
          env:
            - name: PIWATCH_PASSWORD
              valueFrom: {secretKeyRef: {name: piwatch, key: password}}
            - name: PIWATCH_SECRET
              valueFrom: {secretKeyRef: {name: piwatch, key: secret}}
            - name: PIWATCH_CHECKS_FILE
              value: /config/healthchecks.yaml
            - name: PIWATCH_AGENT_SERVICE
              value: piwatch-node-agent.monitoring.svc.cluster.local
            # Auto-generates healthchecks from discovered HTTPRoutes/LoadBalancer Services
            # (see collectors/autochecks.py) -- additive to PIWATCH_CHECKS_FILE, needs no
            # extra RBAC (only reads already-collected state, makes no K8s API calls of its own).
            - name: PIWATCH_AUTO_HEALTHCHECKS
              value: "1"
            # Optional (see collectors/pvc.py): enables PVC usage % on the Storage card. Remove
            # this line if your cluster doesn't run Prometheus -- capacity/status still show
            # without it, just no usage column. Needs a matching NetworkPolicy ingress rule on
            # Prometheus if your cluster uses default-deny (see the studylife repo's
            # k8s/12-network-policies.yaml allow-ingress-to-prometheus for the pattern).
            - name: PIWATCH_PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            # Persists node_history to /data/history.db (hostPath, see the `history`
            # volume below) so the chart window survives a pod restart instead of starting
            # empty. Bounded to PIWATCH_HISTORY_RETENTION_DAYS via periodic pruning, not unlimited.
            - name: PIWATCH_HISTORY_DB
              value: /data/history.db
            - name: PIWATCH_HISTORY_RETENTION_DAYS
              value: "14"
          volumeMounts:
            - {name: checks, mountPath: /config, readOnly: true}
            - {name: history, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: checks
          configMap:
            name: piwatch-healthchecks
            optional: true
        # Node-local, not a PVC -- see the PIWATCH_HISTORY_DB comment above.
        - name: history
          hostPath:
            path: /var/lib/piwatch-history
            type: DirectoryOrCreate
