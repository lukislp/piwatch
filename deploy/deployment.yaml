apiVersion: apps/v1
kind: Deployment
metadata:
  name: piwatch
  namespace: monitoring
  labels: {app: piwatch}
spec:
  # HA/failover: 2 replicas on different nodes. If one node goes down,
  # the second replica keeps serving; clients reconnect automatically.
  replicas: 2
  selector:
    matchLabels: {app: piwatch}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: piwatch}
    spec:
      serviceAccountName: piwatch
      affinity:
        podAntiAffinity:
          # preferred instead of required: if only 1 node remains, both
          # replicas are allowed to run there if needed.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: piwatch}
      containers:
        - name: piwatch
          image: ghcr.io/lukislp/piwatch:1.18.3 # {"$imagepolicy": "flux-system:piwatch"}
          # No runAsNonRoot: the image has no USER directive (runs as root) - enforcing it
          # retroactively would crash without an accompanying Dockerfile change (+rebuild).
          # allowPrivilegeEscalation/capabilities are safe independently of that, because the
          # app needs neither setuid binaries nor special Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - containerPort: 8000
          env:
            - name: PIWATCH_PASSWORD
              valueFrom: {secretKeyRef: {name: piwatch, key: password}}
            - name: PIWATCH_SECRET
              valueFrom: {secretKeyRef: {name: piwatch, key: secret}}
            - name: PIWATCH_CHECKS_FILE
              value: /config/healthchecks.yaml
            - name: PIWATCH_AGENT_SERVICE
              value: piwatch-node-agent.monitoring.svc.cluster.local
            # Auto-generates healthchecks from discovered HTTPRoutes/LoadBalancer Services
            # (see collectors/autochecks.py) -- additive to PIWATCH_CHECKS_FILE, needs no
            # extra RBAC (only reads already-collected state, makes no K8s API calls of its own).
            - name: PIWATCH_AUTO_HEALTHCHECKS
              value: "1"
            # Optional (see collectors/pvc.py): enables PVC usage % on the Storage card. Remove
            # this line if your cluster doesn't run Prometheus -- capacity/status still show
            # without it, just no usage column. Needs a matching NetworkPolicy ingress rule on
            # Prometheus if your cluster uses default-deny (see the studylife repo's
            # k8s/12-network-policies.yaml allow-ingress-to-prometheus for the pattern).
            - name: PIWATCH_PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            # Optional (see collectors/history.py): persists node_history to /data/history.db
            # so the chart window survives a pod restart instead of starting empty, bounded to
            # PIWATCH_HISTORY_RETENTION_DAYS (default 7) via periodic pruning. Uncomment both to
            # enable -- left off here since the `history` volume below is hostPath, tied to
            # whichever node this replica currently runs on (see collectors/history.py's
            # docstring for why: a shared PVC would conflict with the anti-affinity spread).
            # - name: PIWATCH_HISTORY_DB
            #   value: /data/history.db
            # - name: PIWATCH_HISTORY_RETENTION_DAYS
            #   value: "7"
          volumeMounts:
            - {name: checks, mountPath: /config, readOnly: true}
            - {name: history, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: checks
          configMap:
            name: piwatch-healthchecks
            optional: true
        # Node-local, not a PVC -- see the PIWATCH_HISTORY_DB comment above. Unused disk
        # space until that env var is set (an empty directory costs nothing).
        - name: history
          hostPath:
            path: /var/lib/piwatch-history
            type: DirectoryOrCreate
