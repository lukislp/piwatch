# Points Flux at this repo. Needs write access (not just read), since
# image-automation-controller pushes commits for new image tags directly to master (see
# 04-image-update-automation.yaml). Reuses the cluster-wide "studylife-git-auth" secret
# (flux-system namespace, managed in the homelab-infra repo) rather than a repo-specific one - a
# classic GitHub PAT (public_repo scope), which GitHub never scopes to a single repo anyway, so
# it already covers this repo too.
#
# Previously defined in studylife's own k8s/flux/16-piwatch-git-source.yaml - moved here so this
# repo owns its own Flux wiring instead of studylife managing it on this repo's behalf.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: piwatch
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/piwatch.git
  ref:
    branch: master
  secretRef:
    name: studylife-git-auth
