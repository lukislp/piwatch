# Automatically commits new image tags to master (directly, no PR). Patches ONLY the marker
# comments in deploy/deployment.yaml AND deploy/daemonset-node-agent.yaml
# (# {"$imagepolicy": "flux-system:piwatch"}). update.path is "./deploy" (not "./k8s") -
# this repo's manifests live under deploy/, not k8s/. "[skip ci]" in the commit template is
# MANDATORY - without it, a plain image-tag commit would still trigger the entire CI pipeline
# again for no reason.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: piwatch
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: piwatch
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./deploy
    strategy: Setters
