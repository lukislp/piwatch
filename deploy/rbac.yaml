apiVersion: v1
kind: ServiceAccount
metadata:
  name: piwatch
  namespace: monitoring
---
# Read-only: PiWatch observes the cluster but never changes anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: piwatch-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Optional: only used if Flux is installed (see backend/app/collectors/flux.py). Harmless
  # if the CRD doesn't exist -- RBAC rules for a nonexistent resource type never match anything.
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: piwatch-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: piwatch-readonly
subjects:
  - kind: ServiceAccount
    name: piwatch
    namespace: monitoring
