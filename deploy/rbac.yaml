apiVersion: v1
kind: ServiceAccount
metadata:
  name: piwatch
  namespace: monitoring
---
# Read-only: PiWatch observes the cluster but never changes anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: piwatch-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events, services, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Optional: only used if Flux (and its image-automation controllers) is installed (see
  # backend/app/collectors/flux.py). Harmless if a CRD doesn't exist -- an RBAC rule for a
  # nonexistent resource type never matches anything.
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories, imagepolicies, imageupdateautomations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: piwatch-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: piwatch-readonly
subjects:
  - kind: ServiceAccount
    name: piwatch
    namespace: monitoring
