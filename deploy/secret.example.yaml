# Copy to secret.yaml and set the values -- DO NOT commit!
#   password: dashboard login password
#   secret:   any long random string (token signing, must be identical
#             across all replicas -> same secret source)
apiVersion: v1
kind: Secret
metadata:
  name: piwatch
  namespace: monitoring
type: Opaque
stringData:
  password: CHANGE_ME
  secret: CHANGE_ME_RANDOM_64_CHARS
