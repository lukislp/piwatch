# The standalone ml/ project (offline analysis and model experiments; no image ships it).
# Dependencies are locked with hashes in uv.lock: edit here, then `uv lock` in ml/.
[project]
name = "piwatch-ml"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.9.0",
    "torch>=2.15.0",
    "mlflow>=3.18.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

# torch comes from the PyTorch CPU index (2.x+cpu): ml/ needs no GPU, and the default PyPI
# wheel pulls about 2.9 GB of CUDA libraries into every install. `explicit` keeps this index
# for torch alone; everything else resolves from PyPI. uv records the index's hashes in
# uv.lock, and Dependabot updates the lock by running uv, so torch updates work like any other.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
